name: eureka-theme-v2

x-theme-v2-service: &theme-v2-service
  image: eureka-theme-v2-service:local
  build:
    context: ./theme_v2_service
    additional_contexts:
      geist: ./mobile/assets/fonts/Geist

x-theme-v2-environment: &theme-v2-environment
  DATABASE_URL: mysql://theme_v2:${THEME_V2_DB_PASSWORD:-theme_v2}@mysql:3306/eureka_theme_v2
  JWT_SECRET: ${THEME_V2_JWT_SECRET:-dev-insecure-change-me}
  ENV: ${THEME_V2_ENV:-dev}
  MEDIA_ROOT: /data/media

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: eureka_theme_v2
      MYSQL_USER: theme_v2
      MYSQL_PASSWORD: ${THEME_V2_DB_PASSWORD:-theme_v2}
      MYSQL_ROOT_PASSWORD: ${THEME_V2_DB_ROOT_PASSWORD:-theme_v2_root}
    ports:
      - "127.0.0.1:${THEME_V2_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./theme_v2_service/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u theme_v2 -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *theme-v2-service
    command: alembic upgrade head
    environment: *theme-v2-environment
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./theme_v2_service:/app
      - media_data:/data/media

  api:
    <<: *theme-v2-service
    ports:
      - "${THEME_V2_API_HOST_PORT:-8100}:8000"
    environment: *theme-v2-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./theme_v2_service:/app
      - media_data:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    <<: *theme-v2-service
    command: python -m app.worker
    environment: *theme-v2-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./theme_v2_service:/app
      - media_data:/data/media
    stop_grace_period: 90s

  test:
    <<: *theme-v2-service
    profiles: ["test"]
    environment:
      DATABASE_URL: mysql://theme_v2:${THEME_V2_DB_PASSWORD:-theme_v2}@mysql:3306/eureka_theme_v2_test
      JWT_SECRET: test-only-secret
      ENV: test
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./theme_v2_service:/app
      - media_data:/data/media

volumes:
  mysql_data:
  media_data:
